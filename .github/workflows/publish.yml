name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  NODE_VERSION: 22.18.0

jobs:
  verify-tag:
    name: Verify release tag
    if: >-
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: node scripts/check-tag.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  verify:
    name: Verify release
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  release-package:
    name: Package verified release
    if: >-
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v5
        with:
          name: package-dist
          path: dist/
      - run: node scripts/check-unpublished.mjs
      - run: node scripts/pack.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-tarball
          path: artifacts/*.tgz
          if-no-files-found: error

  publish:
    name: Publish verified tarball
    if: >-
      github.event_name == 'push' &&
      github.event.created == true &&
      github.event.deleted == false &&
      startsWith(github.ref, 'refs/tags/v')
    needs: release-package
    runs-on: ubuntu-24.04
    # Configure required reviewers and restrict this environment to v* tags.
    environment: production
    concurrency:
      group: npm-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v5
        with:
          name: release-tarball
          path: artifacts/
      - run: sh scripts/publish.sh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
