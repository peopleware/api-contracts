name: Publish release to NPM

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Require a release tag
        if: github.ref_type != 'tag'
        run: |
          echo "::error::Select the published release tag under 'Use workflow from'."
          exit 1
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify published GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          is_draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [ "$is_draft" != "false" ]; then
            echo "::error::Release $RELEASE_TAG must be published before publishing to npm."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: node scripts/check-tag.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}

  verify:
    name: Verify release
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    # Configure required reviewers and restrict this environment to main and v* tags.
    environment: production
    concurrency:
      group: npm-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: dist/
      - run: node scripts/check-tag.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: npm publish --access public
