name: Publish release to NPM

on:
  workflow_call:
    inputs:
      release_tag:
        description: Release tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - run: node scripts/check-tag.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}

  verify:
    name: Verify release
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish verified release
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    # Configure required reviewers and restrict this environment to v* tags.
    environment: production
    concurrency:
      group: npm-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          check-latest: true
      - uses: actions/download-artifact@v8
        with:
          name: package-dist
          path: dist/
      - run: node scripts/check-tag.mjs
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
      - run: npm publish --access public
